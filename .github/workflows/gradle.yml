name: Java CI with Gradle
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

env:
  RELEASE_BRANCH: refs/heads/dev/4.0.0

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != env.RELEASE_BRANCH }}

      - name: Generate Release Tag
        if: github.ref == env.RELEASE_BRANCH
        id: release_tag
        run: |
          git fetch --tags

          LATEST_BUILD=0
          if git tag | grep -qE "^build-[0-9]+$"; then
            LATEST_BUILD=$(git tag | grep -E "^build-[0-9]+$" | sed 's/build-//' | sort -n | tail -1)
          fi

          NEW_BUILD=$((LATEST_BUILD + 1))
          echo "tag=build-$NEW_BUILD" >> "$GITHUB_OUTPUT"
          echo "build_nr=$NEW_BUILD" >> "$GITHUB_OUTPUT"
          echo "Building build-$NEW_BUILD (previous highest: $LATEST_BUILD)"

      - name: Build with Gradle
        env:
          BUILD_NUMBER: ${{ steps.release_tag.outputs.build_nr }}
        run: ./gradlew build

      - name: Rename Release Jar
        if: github.ref == env.RELEASE_BRANCH
        run: |
          FAT_JAR=$(ls proxy/build/libs/velocity-proxy-*-all.jar)
          VERSION=${FAT_JAR#proxy/build/libs/velocity-proxy-}
          VERSION=${VERSION%-all.jar}
          cp "$FAT_JAR" "proxy/build/libs/continuum-$VERSION-${{ steps.release_tag.outputs.build_nr }}.jar"

      - name: Upload Build Artifacts
        if: github.ref != env.RELEASE_BRANCH
        uses: actions/upload-artifact@v5
        with:
          name: continuum-jars
          path: |
            proxy/build/libs/velocity-proxy-*-all.jar
          if-no-files-found: error

      - name: Upload as GitHub Release
        if: github.ref == env.RELEASE_BRANCH
        uses: softprops/action-gh-release@v3
        with:
          name: "Continuum ${{ steps.release_tag.outputs.tag }}"
          tag_name: "${{ steps.release_tag.outputs.tag }}"
          token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          generate_release_notes: true
          body: |
            ## Continuum

            Vanilla Velocity 4.x with the seamless-switch work ported as
            config-gated options (`remove-reconfig`,
            `keep-client-world-on-switch`), the `ClientWorldSwitches` API and
            the Sunny-SMP remove-reconfig series on top of PaperMC
            `dev/4.0.0`.

            Download `continuum-<version>-<build>.jar` and run:

            ```bash
            java -Xms256M -Xmx512M -jar continuum-<version>-<build>.jar
            ```

            ---
          files: |
            proxy/build/libs/continuum-*-${{ steps.release_tag.outputs.build_nr }}.jar