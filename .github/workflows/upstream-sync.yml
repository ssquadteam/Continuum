# Merges PaperMC Velocity dev/4.0.0 into Continuum and opens a pull request when the result builds.
#
# Nothing is ever pushed to the default branch. A clean, building merge becomes a PR; a conflicted or broken
# merge becomes an issue naming what went wrong. Both are reused across runs rather than piling up.

name: Upstream Sync

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "PaperMC Velocity branch to merge"
        required: false
        default: "dev/4.0.0"

env:
  UPSTREAM_URL: https://github.com/PaperMC/Velocity.git
  UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || 'dev/4.0.0' }}
  SYNC_BRANCH: upstream-sync
  ISSUE_LABEL: upstream-sync
  # Adding the upstream git remote makes gh guess the wrong repository, so pin it.
  GH_REPO: ${{ github.repository }}

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout dev/4.0.0
        uses: actions/checkout@v7
        with:
          ref: dev/4.0.0
          fetch-depth: 0

      - name: Fetch upstream
        id: fetch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream "$UPSTREAM_REF"

          UPSTREAM_SHA=$(git rev-parse FETCH_HEAD)
          echo "sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "short=${UPSTREAM_SHA:0:9}" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo "behind=0" >> "$GITHUB_OUTPUT"
            echo "Already up to date with $UPSTREAM_REF."
          else
            echo "behind=$(git rev-list --count HEAD.."$UPSTREAM_SHA")" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream
        id: merge
        if: steps.fetch.outputs.behind != '0'
        run: |
          git checkout -B "$SYNC_BRANCH"

          if git merge --no-edit --no-ff FETCH_HEAD \
              -m "Merge PaperMC Velocity $UPSTREAM_REF at ${{ steps.fetch.outputs.short }}"; then
            echo "conflicted=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "conflicted=true"
              echo "files<<EOF"
              git diff --name-only --diff-filter=U
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Set up JDK 25
        if: steps.merge.outputs.conflicted == 'false'
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        if: steps.merge.outputs.conflicted == 'false'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Build merged tree
        id: build
        if: steps.merge.outputs.conflicted == 'false'
        continue-on-error: true
        run: ./gradlew build

      - name: Push and open pull request
        if: steps.merge.outputs.conflicted == 'false' && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push --force origin "$SYNC_BRANCH"

          COMPARE_URL="${{ github.server_url }}/${{ github.repository }}/compare/dev/4.0.0...$SYNC_BRANCH?expand=1"
          PR_HEAD="${{ github.repository_owner }}:$SYNC_BRANCH"

          if [ "$(gh pr list --head "$PR_HEAD" --state open --json number --jq 'length')" != "0" ]; then
            echo "Pull request already open, branch updated in place."
            exit 0
          fi

          SUMMARY="Merges [\`$UPSTREAM_REF\`](https://github.com/PaperMC/Velocity/commits/$UPSTREAM_REF) at \`${{ steps.fetch.outputs.sha }}\`, ${{ steps.fetch.outputs.behind }} commits ahead of \`dev/4.0.0\`.

          The merge applied cleanly and \`./gradlew build\` passed on the result.

          Worth a look before merging: Continuum carries branding, the \`remove-reconfig\` and \`keep-client-world-on-switch\` options, compression observability, and its own workflows. A clean merge does not prove upstream did not change behaviour underneath those."

          if gh pr create \
              --base dev/4.0.0 \
              --head "$SYNC_BRANCH" \
              --title "Merge PaperMC Velocity $UPSTREAM_REF (${{ steps.fetch.outputs.short }})" \
              --body "$SUMMARY"; then
            exit 0
          fi

          echo "::warning::Could not open a pull request; the merge is on \`$SYNC_BRANCH\`."
          echo "Compare: $COMPARE_URL"

          TITLE="Upstream sync: PaperMC Velocity $UPSTREAM_REF ready to merge"
          BODY="$SUMMARY

          The merge is waiting on the \`$SYNC_BRANCH\` branch:

          $COMPARE_URL

          Turning on *Settings -> Actions -> General -> Allow GitHub Actions to create and approve pull requests* lets this open the pull request directly."

          if EXISTING=$(gh issue list --label "$ISSUE_LABEL" --state open --json number,title \
              --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty"); then
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "$BODY" && exit 0
            else
              gh label create "$ISSUE_LABEL" --color ededed --description "Automated PaperMC Velocity sync" || true
              (gh issue create --title "$TITLE" --label "$ISSUE_LABEL" --body "$BODY" \
                || gh issue create --title "$TITLE" --body "$BODY") && exit 0
            fi
          fi

          # Issues may be disabled, or Actions may be barred from opening them. The branch is the
          # deliverable either way; do not fail a successful merge and push.
          echo "::warning::Could not open an issue either. Open the compare URL to finish the sync: $COMPARE_URL"
          exit 0

      - name: Report a problem
        if: |
          steps.fetch.outputs.behind != '0' &&
          (steps.merge.outputs.conflicted == 'true' || steps.build.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.merge.outputs.conflicted }}" = "true" ]; then
            TITLE="Upstream sync: conflicts merging PaperMC Velocity $UPSTREAM_REF"
            BODY="Merging \`$UPSTREAM_REF\` at \`${{ steps.fetch.outputs.sha }}\` hit conflicts, so nothing was pushed.

          Conflicting files:
          \`\`\`
          ${{ steps.merge.outputs.files }}
          \`\`\`

          Resolve locally:
          \`\`\`bash
          git remote add papermc $UPSTREAM_URL   # once
          git fetch papermc $UPSTREAM_REF
          git checkout -b $SYNC_BRANCH dev/4.0.0
          git merge FETCH_HEAD
          \`\`\`"
          else
            TITLE="Upstream sync: build failed after merging PaperMC Velocity $UPSTREAM_REF"
            BODY="\`$UPSTREAM_REF\` at \`${{ steps.fetch.outputs.sha }}\` merged cleanly but \`./gradlew build\` failed on the result, so no pull request was opened.

          See [the run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for the compiler output."
          fi

          EXISTING=$(gh issue list --label "$ISSUE_LABEL" --state open --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty" || true)

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY" || true
          else
            gh label create "$ISSUE_LABEL" --color ededed --description "Automated PaperMC Velocity sync" || true
            gh issue create --title "$TITLE" --label "$ISSUE_LABEL" --body "$BODY" \
              || gh issue create --title "$TITLE" --body "$BODY" \
              || echo "::error::$TITLE"
          fi
